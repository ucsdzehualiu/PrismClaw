<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrismHarness — 透明 AI 助手</title>
<link rel="icon" href="data:,">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ---- DeepSeek Harness (DSH) design tokens, dark theme ---- */
  --bg-base:#17171a;              /* neutral-bluish-950 */
  --bg-layer-1:#1d1d21;           /* neutral-bluish-875 */
  --bg-layer-2:#212126;           /* neutral-bluish-850 */
  --bg-layer-3:#28282d;           /* neutral-bluish-800 */
  --bg-input:#1b1b1f;

  --border-l1:rgba(255,255,255,0.06);
  --border-l2:rgba(255,255,255,0.12);
  --border-l3:rgba(255,255,255,0.16);

  --text-primary:#f5f6f7;         /* bluish-50  #f5f6f7 */
  --text-secondary:#cfd3d6;       /* bluish-300 */
  --text-tertiary:#979da6;        /* bluish-500 */
  --text-dim:#8f9399;

  /* ---- compatibility aliases used by dynamic JS-generated inline styles ---- */
  --bg-card:var(--bg-layer-2);
  --text:var(--text-secondary);
  --text-bright:var(--text-primary);
  --border:var(--border-l2);

  --accent:#679efe;               /* deepseek-400 */
  --accent-strong:#4176e6;        /* deepseek-500 */
  --accent-glow:rgba(103,158,254,0.16);

  --success:#22c55e;
  --success-soft:rgba(78,209,126,0.14);
  --warn:#f59e0b;
  --warn-soft:rgba(245,158,11,0.14);
  --danger:#ef4444;
  --danger-soft:rgba(239,68,68,0.14);
  --orange:#ff9f55;
  --purple:#c4b5fd;
  --cyan:#7fd4ff;

  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',
    'Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,Courier,
    'PingFang SC','Microsoft YaHei';
  --ease:cubic-bezier(0.4,0,0.2,1);
  --radius:10px; --radius-sm:7px; --radius-xs:5px;
  --transition:0.2s var(--ease);
}
body{font-family:var(--font-sans);background:var(--bg-base);color:var(--text-primary);
  height:100vh;overflow:hidden;font-variant-numeric:tabular-nums;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-optical-sizing:auto}
.app{display:flex;height:100vh;flex-direction:column}

/* ---- Toolbar / header ---- */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:var(--bg-layer-1);border-bottom:1px solid var(--border-l1);min-height:56px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--text-primary);
  letter-spacing:0.01em;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent-strong),var(--accent));color:#fff;font-size:15px;
  box-shadow:0 4px 12px rgba(65,118,230,0.35)}
.brand .sub{color:var(--text-tertiary);font-weight:500;font-size:12px;margin-left:2px}
.toolbar .actions{display:flex;align-items:center;gap:6px}
.btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-l2);
  background:var(--bg-layer-2);color:var(--text-primary);cursor:pointer;font-size:12.5px;
  font-family:var(--font-sans);transition:background var(--transition),border-color var(--transition),color var(--transition);
  display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--bg-layer-3);border-color:var(--border-l3)}
.btn:active{transform:translateY(0.5px)}
.btn.accent{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;font-weight:600}
.btn.accent:hover{background:var(--accent);border-color:var(--accent)}
.btn.danger{background:var(--danger-soft);border-color:var(--border-l2);color:var(--danger)}

/* ---- Main Panels ---- */
.main{display:grid;flex:1;overflow:hidden;
  grid-template-columns:214px minmax(340px,1fr) minmax(500px,1.05fr)}
.panel{overflow-y:auto;overflow-x:hidden}

/* ---- Left rail / sidebar ---- */
.panel-sidebar{display:flex;flex-direction:column;gap:6px;min-width:0;
  padding:14px 12px;background:var(--bg-layer-1);border-right:1px solid var(--border-l1)}
.sidebar-action{padding:9px 12px;border-radius:var(--radius-sm);border:1px solid transparent;
  background:transparent;color:var(--text-secondary);cursor:pointer;
  font-size:13px;text-align:left;transition:background var(--transition),color var(--transition);
  display:flex;align-items:center;gap:8px;font-weight:500}
.sidebar-action:hover{background:var(--bg-layer-2);color:var(--text-primary)}
.sidebar-action.accent{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;font-weight:600}
.sidebar-action.accent:hover{background:var(--accent)}
.sidebar-section{display:flex;flex-direction:column;gap:5px;margin-top:14px;padding:0 4px}
.sidebar-label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary);font-weight:600}
.sidebar-value{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
.sidebar-note{margin-top:auto;padding:10px 12px;font-size:11px;color:var(--text-tertiary);
  border:1px solid var(--border-l1);border-radius:var(--radius-sm);line-height:1.6}

/* ---- Session list in sidebar ---- */
.session-list{display:flex;flex-direction:column;gap:3px;max-height:40vh;overflow-y:auto}
.session-list::-webkit-scrollbar{width:4px}
.session-list::-webkit-scrollbar-thumb{background:var(--border-l2);border-radius:2px}
.session-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--radius-xs);
  cursor:pointer;font-size:12px;color:var(--text-secondary);user-select:none;width:100%;
  transition:background var(--transition),color var(--transition)}
.session-item:hover{background:var(--bg-layer-2);color:var(--text-primary)}
.session-item.active{background:var(--accent-glow);color:var(--text-primary);font-weight:500}
.session-item .si-time{font-size:9.5px;color:var(--text-tertiary);margin-left:auto;flex-shrink:0;font-variant-numeric:tabular-nums}
.session-item .si-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .si-del{flex:none;font-size:13px;line-height:1;color:var(--text-tertiary);cursor:pointer;
  opacity:0;padding:0 3px;border-radius:3px;transition:opacity var(--transition),color var(--transition)}
.session-item:hover .si-del{opacity:1}
.session-item .si-del:hover{color:var(--danger)}
.session-empty{padding:6px 2px;font-size:11.5px;color:var(--text-tertiary);line-height:1.5}

/* ---- Tabs ---- */
.view-tabs,.detail-tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--border-l1);
  background:var(--bg-layer-1)}
.view-tab,.detail-tab{padding:7px 12px;border:none;background:transparent;color:var(--text-tertiary);
  cursor:pointer;font-size:13px;border-bottom:2px solid transparent;font-weight:500;
  transition:color var(--transition),border-color var(--transition)}
.view-tab:hover,.detail-tab:hover{color:var(--text-primary)}
.view-tab.active,.detail-tab.active{color:var(--text-primary);border-bottom-color:var(--accent-strong)}

/* ---- Chat ---- */
.panel-chat{display:flex;flex-direction:column;background:var(--bg-base)}
.chat-messages{flex:1;overflow-y:auto;padding:20px 22px 28px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border-l2);border-radius:3px}
.chat-input-area{padding:14px 20px 16px;border-top:1px solid var(--border-l1);background:var(--bg-layer-1)}
.chat-input{display:flex;gap:10px;align-items:flex-end}
.chat-input textarea{flex:1;background:var(--bg-input);border:1px solid var(--border-l2);
  color:var(--text-primary);padding:12px 16px;border-radius:var(--radius);resize:none;
  font-family:var(--font-sans);font-size:14px;min-height:46px;max-height:120px;line-height:1.5;
  transition:border-color var(--transition),box-shadow var(--transition)}
.chat-input textarea:focus{outline:none;border-color:var(--accent-strong);box-shadow:0 0 0 3px var(--accent-glow)}
.chat-input textarea::placeholder{color:var(--text-tertiary)}

/* ---- Trace view ---- */
.trace-view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-base)}
.trace-summary{flex:none;padding:12px 20px;border-bottom:1px solid var(--border-l1);
  font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}
.trace-log{flex:1;overflow:auto;padding:10px 20px 20px;font-family:var(--font-mono);font-size:12.5px}
.trace-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border-l1)}
.trace-row:hover{background:rgba(255,255,255,0.02)}
.trace-role{color:var(--text-tertiary);font-size:10.5px;line-height:1.6;letter-spacing:0.05em;
  text-transform:uppercase;padding-top:2px;font-weight:600}
.trace-role.system{color:var(--purple)}
.trace-role.user{color:var(--accent)}
.trace-role.assistant{color:var(--success)}
.trace-role.tool{color:var(--orange)}
.trace-content{min-width:0;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.trace-tool{display:inline-flex;padding:2px 8px;margin-right:8px;border-radius:var(--radius-xs);
  background:rgba(255,159,85,0.12);color:var(--orange);font-weight:600}
.trace-json{color:var(--cyan);white-space:pre-wrap;word-break:break-word}
.trace-output{margin:8px 0 0 108px;padding:9px 12px;border-left:2px solid var(--border-l3);
  color:var(--text-tertiary);white-space:pre-wrap;word-break:break-word;line-height:1.55;
  background:var(--bg-layer-1);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.trace-output pre{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--text-tertiary)}
.trace-arrow{display:inline-block;margin-right:8px;color:var(--success);font-weight:700}
.trace-output.has-error{border-left-color:var(--danger)}
.trace-output.has-error pre{color:#fca5a5}
.trace-turn{grid-column:1/-1;margin:10px 0 2px;padding-top:10px;color:var(--text-primary);
  font-size:11px;letter-spacing:0.05em;text-transform:uppercase;border-top:1px solid var(--border-l2);font-weight:600}
.trace-state{display:inline-flex;align-items:center;gap:6px;color:var(--text-tertiary)}
.trace-state::before{content:"";width:7px;height:7px;border-radius:3px;background:var(--success)}
.trace-state.running{color:var(--accent)}
.trace-state.running::before{background:var(--accent-strong);box-shadow:0 0 0 3px var(--accent-glow)}
.trace-state.error{color:var(--danger)}
.trace-state.error::before{background:var(--danger)}

/* ---- Message bubbles ---- */
.msg{margin-bottom:20px;animation:fadeIn 0.25s var(--ease)}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--accent-strong);color:#fff;max-width:80%;border-radius:14px 4px 14px 14px}
.msg.assistant .bubble{background:var(--bg-layer-1);max-width:85%;border-radius:4px 14px 14px 14px;
  border:1px solid var(--border-l1)}
.msg.system .bubble{background:transparent;max-width:90%;font-style:italic;color:var(--text-tertiary);
  font-size:13px;text-align:center}
.bubble{padding:12px 16px;line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble code{background:rgba(0,0,0,0.28);padding:1.5px 6px;border-radius:4px;font-family:var(--font-mono);font-size:12.5px}
.bubble pre{background:#101013;border:1px solid var(--border-l1);padding:12px;border-radius:var(--radius-sm);
  overflow-x:auto;margin:8px 0;font-size:12.5px;line-height:1.55}
.bubble pre code{background:none;padding:0}

/* ---- Tool card ---- */
.tool-card{margin:8px 0;border-radius:var(--radius-sm);border:1px solid var(--border-l1);
  border-left:3px solid var(--orange);background:rgba(255,159,85,0.05);overflow:hidden;font-size:13px}
.tool-card .tool-header{padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;
  color:var(--orange);font-weight:600;user-select:none;border-bottom:1px solid var(--border-l1)}
.tool-card .tool-state{flex:none;width:7px;height:7px;border-radius:3px;background:var(--orange);
  box-shadow:0 0 0 3px rgba(255,159,85,0.10)}
.tool-card:not(.loading) .tool-state{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.tool-card .tool-header .arrow{transition:transform 0.2s;font-size:10px;color:var(--text-tertiary)}
.tool-card.open .tool-header .arrow{transform:rotate(90deg)}
.tool-card .tool-body{display:none;padding:10px 12px 12px;font-family:var(--font-mono);font-size:12px;
  color:var(--text-tertiary);border-top:1px solid var(--border-l1);max-height:200px;overflow-y:auto}
.tool-card.open .tool-body{display:block}
.tool-card .tool-body .result-label{color:var(--success);margin-top:6px;font-weight:600}
.tool-card.loading .tool-header::after{content:'';display:inline-block;width:100px;height:3px;
  background:linear-gradient(90deg,var(--accent),transparent);animation:shimmer 1.5s infinite;
  border-radius:2px;margin-left:auto}
@keyframes shimmer{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}

/* ---- HITL confirm ---- */
.confirm-card{border-left-color:var(--warn)!important;background:var(--warn-soft)!important}
.confirm-card .tool-header{color:var(--warn)!important}
.confirm-card .confirm-actions{display:flex;gap:8px;padding:4px 12px 12px}
.confirm-card .confirm-actions .btn{font-size:12px;padding:5px 10px}
.confirm-card .confirm-actions .btn.approve{background:var(--success);border-color:var(--success);color:#fff}

/* ---- Right detail rail ---- */
.panel-details{min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-layer-1);
  border-left:1px solid var(--border-l1)}
.detail-tabs{background:var(--bg-layer-1)}
.panel-details .panel{min-width:0;border-right:none}
.panel-context{flex:1 1 52%;min-height:0;background:var(--bg-layer-1);display:flex;flex-direction:column;
  border-bottom:1px solid var(--border-l1)}
.panel-context .panel-header{padding:14px 18px;border-bottom:1px solid var(--border-l1);
  color:var(--text-primary);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:0.06em;display:flex;align-items:center;gap:9px}
.panel-context .panel-header .dot{width:8px;height:8px;border-radius:3px;background:var(--accent-strong);
  box-shadow:0 0 0 3px var(--accent-glow)}
.context-content{flex:1;overflow-y:auto;padding:16px}
.context-content::-webkit-scrollbar{width:4px}
.context-content::-webkit-scrollbar-thumb{background:var(--border-l2);border-radius:2px}

.context-section{margin-bottom:16px}
.context-section .section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
  color:var(--text-tertiary);margin-bottom:8px;font-weight:600}
.context-block{background:var(--bg-layer-2);border:1px solid var(--border-l1);border-radius:var(--radius-sm);
  margin-bottom:6px;overflow:hidden}
.context-block .block-header{padding:8px 11px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-size:12.5px;color:var(--text-primary);user-select:none}
.context-block .block-header:hover{background:rgba(255,255,255,0.03)}
.context-block .block-header .size{color:var(--text-tertiary);font-family:var(--font-mono);font-size:10px}
.context-block .block-body{display:none;padding:10px 11px;font-size:11.5px;font-family:var(--font-mono);
  color:var(--text-tertiary);line-height:1.6;border-top:1px solid var(--border-l1);
  max-height:200px;overflow-y:auto;white-space:pre-wrap}
.context-block.open .block-body{display:block}
.context-blocks.collapsed .context-block .block-body{display:none!important}

/* ---- Token bar ---- */
.token-bar{margin:12px 0;padding:12px;background:var(--bg-layer-2);border-radius:var(--radius-sm);
  border:1px solid var(--border-l1)}
.token-bar .bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.token-bar .bar-track{height:6px;background:var(--border-l2);border-radius:3px;overflow:hidden}
.token-bar .bar-fill{height:100%;border-radius:3px;transition:width 0.5s var(--ease)}
.token-bar .bar-fill.safe{background:var(--success)}
.token-bar .bar-fill.warn{background:var(--warn)}
.token-bar .bar-fill.danger{background:var(--danger)}
.token-bar .bar-detail{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;
  font-family:var(--font-mono);color:var(--text-tertiary)}

.context-empty{display:flex;align-items:center;justify-content:center;height:60%;
  color:var(--text-tertiary);font-size:14px;text-align:center;line-height:1.8;
  flex-direction:column;gap:12px}
.context-empty .prism-harness-icon{font-size:46px;opacity:0.25}

/* ---- Tools trace ---- */
.panel-tools{flex:1 1 48%;min-height:0;background:var(--bg-layer-1);display:flex;flex-direction:column}
.panel-tools .panel-header{padding:14px 18px;border-bottom:1px solid var(--border-l1);
  color:var(--text-primary);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:0.06em}
.tools-content{flex:1;overflow-y:auto;padding:16px}
.tools-content::-webkit-scrollbar{width:4px}
.tools-content::-webkit-scrollbar-thumb{background:var(--border-l2);border-radius:2px}
.tool-timeline{position:relative;padding-left:16px}
.tool-timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--border-l2)}
.timeline-item{position:relative;margin-bottom:14px;padding-left:14px}
.timeline-item::before{content:'';position:absolute;left:-14px;top:5px;width:8px;height:8px;
  border-radius:3px;background:var(--border-l3)}
.timeline-item.active::before{background:var(--accent-strong);box-shadow:0 0 0 3px var(--accent-glow)}
.timeline-item:not(.active)::before{background:var(--success)}
.timeline-item .tl-time{font-size:10.5px;color:var(--text-tertiary);font-family:var(--font-mono)}
.timeline-item .tl-tool{font-size:12.5px;font-weight:600;color:var(--text-primary);font-family:var(--font-mono);margin-top:3px}
.timeline-item .tl-detail{font-size:11.5px;color:var(--text-tertiary);font-family:var(--font-mono);
  margin-top:3px;max-height:80px;overflow-y:auto}

/* ---- Full Prompt inspector ---- */
.prompt-blocks{margin-top:4px}
.prompt-block{background:var(--bg-layer-2);border:1px solid var(--border-l1);border-radius:var(--radius-xs);
  margin-bottom:6px;overflow:hidden}
.prompt-block .pb-header{padding:8px 11px;display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:12.5px;user-select:none}
.prompt-block .pb-header:hover{background:rgba(255,255,255,0.03)}
.prompt-block .role-tag{font-weight:700;font-size:10px;padding:2px 8px;border-radius:var(--radius-xs);
  letter-spacing:0.03em;flex-shrink:0}
.prompt-block .pb-idx{color:var(--text-tertiary);font-family:var(--font-mono);font-size:10px;flex-shrink:0}
.prompt-block .pb-chars{color:var(--text-tertiary);font-family:var(--font-mono);font-size:10px;margin-left:auto}
.prompt-block .pb-arrow{color:var(--text-tertiary);font-size:10px;transition:transform 0.2s;flex-shrink:0}
.prompt-block.open .pb-arrow{transform:rotate(90deg)}
.prompt-block .pb-body{display:none;padding:10px 11px;border-top:1px solid var(--border-l1);
  max-height:340px;overflow:auto}
.prompt-block.open .pb-body{display:block}
.prompt-block .pb-body pre{white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);
  font-size:11.5px;color:var(--text-tertiary);line-height:1.55;margin:0}
.prompt-block.role-system{border-left:3px solid var(--purple)}
.prompt-block.role-system .role-tag{background:rgba(196,181,253,0.14);color:var(--purple)}
.prompt-block.role-user{border-left:3px solid var(--accent)}
.prompt-block.role-user .role-tag{background:var(--accent-glow);color:var(--accent)}
.prompt-block.role-assistant{border-left:3px solid var(--success)}
.prompt-block.role-assistant .role-tag{background:var(--success-soft);color:var(--success)}
.prompt-block.role-tool{border-left:3px solid var(--orange)}
.prompt-block.role-tool .role-tag{background:rgba(255,159,85,0.12);color:var(--orange)}
.prompt-block.role-tool .pb-body pre{color:var(--orange)}
.prompt-toggle-all{color:var(--accent);font-size:10.5px;cursor:pointer;font-weight:600}

/* ---- Context view event ---- */
.context-event{border-top:1px dashed var(--border-l2);margin-top:8px;padding-top:8px}

/* ---- Loading indicator ---- */
.loading-dots{display:inline-flex;gap:4px;padding:4px 0}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);animation:bounce 1.4s infinite}
.loading-dots span:nth-child(2){animation-delay:0.2s}
.loading-dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{opacity:0.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ---- Status badge ---- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:0.02em;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.badge.thinking{background:var(--accent-glow);color:var(--accent)}
.badge.thinking::before{animation:blink 1.2s infinite}
.badge.acting{background:rgba(255,159,85,0.12);color:var(--orange)}
.badge.done{background:var(--success-soft);color:var(--success)}
.badge.stopped{background:var(--danger-soft);color:var(--danger)}
.badge.pending{background:var(--warn-soft);color:var(--warn)}
.badge.live{background:var(--accent-glow);color:var(--accent)}
.badge.live::before{animation:blink 1.2s infinite}
.badge.reasoning{background:rgba(196,181,253,0.14);color:var(--purple)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

/* ---- Scrollbars (global) ---- */
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-l3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-tertiary)}

@media(max-width:900px){
  .main{grid-template-columns:1fr;overflow:auto}
  .panel-sidebar{display:none}
  .panel-chat{border-right:none}
  .panel-details{min-height:900px;border-left:none;border-top:1px solid var(--border-l1)}
}
</style>
</head>
<body>
<div class="app">
  <!-- Toolbar / header -->
  <div class="toolbar">
    <div class="brand">
      <div class="mark">◇</div>
      <span>PrismHarness</span>
      <span class="sub">Context Spectrum</span>
    </div>
    <div class="actions">
      <span id="statusBadge" class="badge thinking">就绪</span>
      <span id="liveStatus" class="badge" style="display:none"></span>
      <button class="btn danger" id="stopBtn" onclick="stopGeneration()" style="display:none" title="打断当前生成">⏹ 停止</button>
    </div>
  </div>

  <!-- Main Panels -->
  <div class="main">
    <aside class="panel-sidebar">
      <button class="sidebar-action accent" onclick="newSession()">＋ 新会话</button>
      <div class="sidebar-section">
        <div class="sidebar-label">会话</div>
        <div class="session-list" id="sessionList"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">WORKSPACE</div>
        <div class="sidebar-value">workspace</div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">MODEL</div>
        <div class="sidebar-value">dsv4</div>
      </div>
      <div class="sidebar-note">LOCAL TRACE · 透明化 Agent 每一步实际看到的上下文</div>
    </aside>

    <!-- Panel 1: Chat -->
    <div class="panel panel-chat" id="chatPanel">
      <div class="view-tabs">
        <button class="view-tab active" data-view="chat" onclick="switchView('chat')">对话</button>
        <button class="view-tab" data-view="trace" onclick="switchView('trace')">轨迹</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:14px;flex-direction:column;gap:12px">
          <div style="font-size:40px;opacity:0.3">◇</div>
          <div>开始对话，观察 PrismHarness 的思考过程</div>
          <div style="font-size:12px">右侧面板展示每轮 Agent 实际"看到"的上下文</div>
        </div>
      </div>
      <div class="trace-view" id="traceView" style="display:none">
        <div class="trace-summary" id="traceSummary">等待轨迹数据…</div>
        <div class="trace-log" id="traceLog"></div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input">
          <textarea id="userInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
            rows="1" onkeydown="onInputKey(event)"></textarea>
          <button class="btn accent" onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
      </div>
    </div>

    <!-- Right Detail: Context + Tool Trace -->
    <div class="panel-details">
      <div class="detail-tabs">
        <button class="detail-tab active" data-pane="context" onclick="switchDetailPane('context')">上下文</button>
        <button class="detail-tab" data-pane="tools" onclick="switchDetailPane('tools')">工具</button>
      </div>
      <div class="panel panel-context" id="contextPanel">
        <div class="panel-header">
          <div class="dot"></div> 上下文轨迹 Context Trace
        </div>
        <div class="context-content" id="contextContent">
          <div class="context-empty" id="contextEmpty">
            <div class="prism-harness-icon">▣</div>
            <div>Agent 实际收到的上下文<br>将在这里逐轮展开</div>
          </div>
          <div id="contextData" style="display:none"></div>
        </div>
      </div>

      <div class="panel panel-tools" id="toolsPanel">
        <div class="panel-header">工具轨迹 Tool Trace</div>
        <div class="tools-content" id="toolsContent">
          <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:13px;flex-direction:column;gap:8px">
            <div style="font-size:28px;opacity:0.25">▤</div>
            <div>工具调用会按执行顺序<br>在这里形成轨迹</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ====== State ======
const SESSION_STORAGE_KEY = 'prism_harness_session_id';
let SESSION_ID = sessionStorage.getItem(SESSION_STORAGE_KEY)
  || ('sess-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
sessionStorage.setItem(SESSION_STORAGE_KEY, SESSION_ID);
let currentRequestId = null;
let messages = [];
let toolCalls = [];
let contextRound = 0;
let abortController = null;
let messageBlocks = new Map();    // msg_id -> latest contents[]
let lastAsstId = '';              // magic 命令复用最后一条 assistant 气泡
let lastAsstMsg = null;
let messageIdOrder = [];          // msg_id order
let _stopped = false;             // 用户点了停止，阻止 sendMessage 收尾覆盖状态
let currentTraceUserText = '';
let traceToolSteps = new Map();
let traceViewMode = 'chat';

// ====== DOM ======
const chatMessages = document.getElementById('chatMessages');
const contextContent = document.getElementById('contextContent');
const contextData = document.getElementById('contextData');
const contextEmpty = document.getElementById('contextEmpty');
const toolsContent = document.getElementById('toolsContent');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const statusBadge = document.getElementById('statusBadge');

function switchView(view) {
  traceViewMode = view === 'trace' ? 'trace' : 'chat';
  const chatMessages = document.getElementById('chatMessages');
  const traceView = document.getElementById('traceView');
  const inputArea = document.querySelector('.chat-input-area');
  if (traceViewMode === 'trace') {
    chatMessages.style.display = 'none';
    inputArea.style.display = 'none';
    traceView.style.display = 'flex';
    renderTraceTable();
  } else {
    chatMessages.style.display = '';
    inputArea.style.display = '';
    traceView.style.display = 'none';
  }
  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === traceViewMode);
  });
}

function switchDetailPane(pane) {
  const contextPanel = document.getElementById('contextPanel');
  const toolsPanel = document.getElementById('toolsPanel');
  contextPanel.style.display = pane === 'tools' ? 'none' : 'flex';
  toolsPanel.style.display = pane === 'tools' ? 'flex' : 'none';
  document.querySelectorAll('.detail-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.pane === pane);
  });
}

function traceStateClass(state) {
  return state === 'running' ? 'running' : state === 'error' ? 'error' : '';
}

function isErrorOutput(output) {
  return /\[stderr\]|ParserError|exit code:\s*[1-9]/i.test(output || '');
}

function renderTraceTable() {
  const log = document.getElementById('traceLog');
  const summary = document.getElementById('traceSummary');
  if (!log || !summary) return;

  const blocks = [];
  const assistant = lastAsstMsg || { content: '', toolCalls: [] };

  if (currentTraceUserText) {
    blocks.push({ turn: 'Turn 1' });
    blocks.push({ role: 'SYSTEM', content: 'Initial System Prompt', state: 'done' });
    blocks.push({ role: 'USER', content: currentTraceUserText, state: 'done' });
  }

  if (assistant.toolCalls && assistant.toolCalls.length) {
    blocks.push({ role: 'ASSISTANT', content: '(tool call only)', state: 'done' });
  }

  for (const call of assistant.toolCalls || []) {
    blocks.push({
      role: 'TOOL',
      toolName: call.name || 'tool',
      toolInput: call.input || {},
      output: typeof call.output === 'string' ? call.output : JSON.stringify(call.output || ''),
      state: call.status === 'done' ? 'done' : 'running',
    });
  }

  if (assistant.content && assistant.content.trim()) {
    blocks.push({ role: 'ASSISTANT', content: assistant.content, state: 'done' });
  }

  if (!blocks.length) {
    summary.textContent = '等待轨迹数据…';
    log.innerHTML = '<div class="trace-empty" style="padding:24px;color:var(--text-dim);text-align:center">执行任务后，轨迹会显示在这里</div>';
    return;
  }

  const runningCount = blocks.filter(row => row.state === 'running').length;
  const toolCount = blocks.filter(row => row.role === 'TOOL').length;
  summary.textContent = `1 turn · ${toolCount} call${toolCount === 1 ? '' : 's'} · ${runningCount} running`;
  log.innerHTML = blocks.map((row, index) => {
    if (row.turn) {
      return `<div class="trace-turn">${escapeHtml(row.turn)}</div>`;
    }
    const roleClass = row.role.toLowerCase();
    const content = row.toolName
      ? `<span class="trace-tool">${escapeHtml(row.toolName)}</span><span class="trace-json">${escapeHtml(JSON.stringify(row.toolInput, null, 2))}</span>`
      : escapeHtml(row.content || '');
    const outputClass = isErrorOutput(row.output) ? 'trace-output has-error' : 'trace-output';
    const output = row.output
      ? `<div class="${outputClass}"><span class="trace-arrow">→</span><pre>${escapeHtml(row.output)}</pre></div>`
      : '';
    const state = row.role === 'TOOL'
      ? `<span class="trace-state ${traceStateClass(row.state)}">${row.state}</span>`
      : '';
    return `
      <div class="trace-row">
        <div class="trace-role ${roleClass}">${escapeHtml(row.role)}</div>
        <div class="trace-content">${content}${state}${output}</div>
      </div>`;
  }).join('');
}

// ====== Send ======
function onInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize() {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}
userInput.addEventListener('input', autoResize);

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  setStatus('thinking', '思考中');
  showStopButton(true);   // 流式进行中 → 显示停止按钮
  showLiveStatus(false);

  // Add user message
  addUserMessage(text);
  messages.push({ role: 'user', content: text, contents: [] });

  // Create assistant message placeholder
  const asstId = addAssistantMessage('', true);
  const asstMsg = { role: 'assistant', content: '', contents: [], toolCalls: [] };
  lastAsstId = asstId;      // magic 命令复用
  lastAsstMsg = asstMsg;

  // Reset round
  contextRound++;
  toolCalls = [];
  messageBlocks = new Map();
  messageIdOrder = [];
  currentTraceUserText = text;
  renderTraceTable();

  // SSE request
  if (abortController) abortController.abort();
  abortController = new AbortController();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: SESSION_ID,
        content: [{ type: 'text', text }],
      }),
      signal: abortController.signal,
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));

          if (event.request_id) {
            currentRequestId = event.request_id;
            continue;
          }

          if (event.cancel) {
            updateAssistantContent(asstId, '\n\n[已取消]');
            setStatus('stopped', '已停止');
            break;
          }

          // 实时状态：现在在哪、在干啥
          if (event.type === 'status' || (event.data && event.data.type === 'status')) {
            const st = event.data || event;
            handleLiveStatus(st);
            // guard 发的专门确认事件 → 直接渲染卡片，不靠文本猜
            if (st.phase === 'confirm') {
              renderConfirmCard(asstId, st.detail || '');
            }
            continue;
          }

          if (event.error) {
            updateAssistantContent(asstId, `\n\n❌ 错误: ${event.error}`);
            setStatus('stopped', '出错');
            break;
          }

          // Handle context_view event
          if (event.type === 'context_view' || (event.data && event.data.type === 'context_view')) {
            const ctxData = event.data || event;
            updateContextView(ctxData);
            continue;
          }

          // Process contents via messageBlocks (AgentScope sends accumulated text per msg_id)
          if (event.contents && Array.isArray(event.contents)) {
            const msgId = event.msg_id || 'msg0';
            messageBlocks.set(msgId, event.contents);
            if (!messageIdOrder.includes(msgId)) {
              messageIdOrder.push(msgId);
            }
            // Rebuild from all msg_ids (latest content for each)
            rebuildAssistantMessage(asstId, asstMsg);
          }

          if (event.last) {
            // Don't break — context_view and other events may follow in same buffer
            setStatus('done', '完成');
          }
        } catch (e) { /* skip parse errors */ }
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      let hint = '❌ 连接失败';
      if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
        hint = '❌ 无法连接服务器 — 请确认 launch.bat 正在运行（端口 8765）';
      } else if (err.message.includes('HTTP')) {
        hint = `❌ 服务器错误 (${err.message})`;
      }
      updateAssistantContent(asstId, `\n\n${hint}`);
    }
  }

  sendBtn.disabled = false;
  showStopButton(false);
  if (!_stopped) setStatus('done', '完成');
  _stopped = false;  // 重置，下一轮可用
}

// ====== Rebuild message from messageBlocks ======
function rebuildAssistantMessage(asstId, asstMsg) {
  let allText = '';
  let seenToolUses = new Set();
  let seenToolResults = new Set();

  // Iterate msg_ids in order
  for (const mid of messageIdOrder) {
    const contents = messageBlocks.get(mid) || [];
    for (const item of contents) {
      if (item.type === 'text') {
        // Text is accumulated - use latest from this msg_id only
      }
      else if (item.type === 'tool_use') {
        const id = item.tool_use_id;
        if (!seenToolUses.has(id)) {
          seenToolUses.add(id);
          setStatus('acting', '执行工具');
          let tc = (asstMsg.toolCalls || []).find(t => t.id === id);
          if (!tc) {
            // 新工具调用
            tc = {
              id: id,
              name: item.name || '',
              input: item.input || {},
              output: null,
              status: 'loading',
            };
            asstMsg.toolCalls = asstMsg.toolCalls || [];
            asstMsg.toolCalls.push(tc);
            toolCalls.push(tc);
            addToolCard(asstId, tc);
            updateTimeline(tc);
          } else if (item.input) {
            // 已存在：流式后期 input 更完整，覆盖更新
            // 不能只比 key 数量——{"query":""} 和 {"query":"深圳"} 都是 1 个 key，
            // 但后者值更完整。用序列化长度比较，更长才覆盖。
            const oldStr = JSON.stringify(tc.input || {});
            const newStr = JSON.stringify(item.input);
            if (newStr.length > oldStr.length) {
              tc.input = item.input;
              updateToolCardInput(tc);
            }
          }
        }
      }
      else if (item.type === 'tool_result') {
        const id = item.tool_use_id;
        if (!seenToolResults.has(id)) {
          seenToolResults.add(id);
          const tc = findToolCall(id, asstMsg);
          if (tc) {
            const nextOutput = item.output;
            const isFakeNext = String(nextOutput || '').includes('等待确认');
            const isRealCurrent = String(tc.output || '').includes('<returncode>') || String(tc.output || '').includes('<stdout>');
            if (!(isFakeNext && isRealCurrent)) {
              tc.output = nextOutput;
            }
            tc.status = 'done';
            updateToolCard(tc);
            updateTimelineResult(tc);
          }
        }
      }
    }
  }

  // Extract text: get the text from the LAST msg_id's contents (accumulated)
  // Each msg_id may have its own text blocks; take the concatenated text
  // from each msg_id's latest content
  for (const mid of messageIdOrder) {
    const contents = messageBlocks.get(mid) || [];
    for (const item of contents) {
      if (item.type === 'text') {
        allText += item.content;
      }
    }
  }

  // If last msg_id has only text, just use it (prevent duplication from older msg_ids)
  // AgentScope pattern: each msg_id has full accumulated text from its own reasoning call
  // So concatenating across msg_ids is correct for multi-reasoning rounds
  if (allText !== asstMsg.content) {
    asstMsg.content = allText;
    updateAssistantContent(asstId, allText);
  }
  renderTraceTable();
}

function findToolCall(id, asstMsg) {
  if (!asstMsg.toolCalls) return null;
  return asstMsg.toolCalls.find(t => t.id === id);
}

// ====== Chat rendering ======
function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatMessages.appendChild(div);
  scrollChat();
}

function addAssistantMessage(content, loading) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'asst-' + Date.now();
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.id = div.id + '-bubble';
  bubble.innerHTML = loading ? '<div class="loading-dots"><span></span><span></span><span></span></div>'
    : renderMarkdown(content);
  div.appendChild(bubble);
  chatMessages.appendChild(div);
  scrollChat();
  return div.id;
}

function updateAssistantContent(asstId, content) {
  const bubble = document.getElementById(asstId + '-bubble');
  if (bubble) {
    bubble.innerHTML = renderMarkdown(content);
  }
  maybeRenderConfirm(asstId, content);
  scrollChat();
}

// guard 通过 status 事件发的确认卡片（可靠，不靠文本匹配）
function renderConfirmCard(asstId, detail) {
  const div = document.getElementById(asstId);
  if (!div) return;
  // 移除旧确认卡片（避免重复）
  div.querySelectorAll('.confirm-card').forEach(c => c.remove());
  const card = document.createElement('div');
  card.className = 'tool-card confirm-card';
  card.innerHTML = `
    <div class="tool-header"><span class="arrow">▶</span> 🔒 需要你的确认</div>
    <div style="padding:6px 12px;font-size:12px;color:var(--text-dim);white-space:pre-wrap">${escapeHtml(detail)}</div>
    <div class="confirm-actions">
      <button class="btn accent" onclick="sendMagic('/approve')">✓ 允许执行</button>
      <button class="btn" onclick="sendMagic('/approve_all')" style="background:var(--success);color:#fff">⚡ 允许全部</button>
      <button class="btn" onclick="sendMagic('/reject')">✕ 拒绝</button>
    </div>`;
  // 贴到最近一个 tool card 后面（不限"执行中"状态——guard 可能已改为"等待确认"）
  const toolCards = div.querySelectorAll('.tool-card:not(.confirm-card)');
  if (toolCards.length > 0) {
    const anchor = toolCards[toolCards.length - 1];
    if (anchor.nextSibling) div.insertBefore(card, anchor.nextSibling);
    else div.appendChild(card);
  } else {
    div.appendChild(card);
  }
  scrollChat();
}

// 兜底：assistant 文本里出现确认表述时也渲染（旧路径，模型若绕过 guard 自写文本）
function maybeRenderConfirm(asstId, content) {
  const div = document.getElementById(asstId);
  if (!div) return;
  if (div.dataset.confirmRendered === 'true') return;  // 只渲染一次
  if (!content) return;
  // 只匹配 guard 官方确认模板（🔒 开头 + "工具调用需要确认"），不匹配模型自由文本
  if (!content.includes('🔒') || !content.includes('工具调用需要确认')) return;
  div.dataset.confirmRendered = 'true';
  const card = document.createElement('div');
  card.className = 'tool-card confirm-card';
  card.id = asstId + '-confirm';
  card.innerHTML = `
    <div class="tool-header"><span class="arrow">▶</span> 🔒 需要你的确认</div>
    <div class="confirm-actions">
      <button class="btn accent" onclick="sendMagic('/approve')">✓ 允许执行</button>
      <button class="btn" onclick="sendMagic('/approve_all')" style="background:var(--success);color:#fff">⚡ 允许全部</button>
      <button class="btn" onclick="sendMagic('/reject')">✕ 拒绝</button>
    </div>`;

  // 贴到最近一个 tool card 后面
  const toolCards = div.querySelectorAll('.tool-card:not(.confirm-card)');
  if (toolCards.length > 0) {
    const anchor = toolCards[toolCards.length - 1];
    if (anchor.nextSibling) div.insertBefore(card, anchor.nextSibling);
    else div.appendChild(card);
  } else {
    div.appendChild(card);
  }
  scrollChat();
}

// 发送 /approve 或 /reject —— 走 /chat（和正常消息一样）。
// approve 是正常请求：handle_magic_command 改 pending 状态，
// 然后这个请求的 agent reply 会读到 APPROVED 并重放工具执行。
async function sendMagic(cmd) {
  const text = cmd.trim();
  if (!text) return;
  // 立即把确认卡片置灰
  document.querySelectorAll('.confirm-card').forEach(c => {
    c.style.opacity = '0.5';
    c.style.pointerEvents = 'none';
    c.querySelectorAll('button').forEach(b => b.remove());
  });
  // 复用当前气泡：设置输入框后直接发 SSE，不建新用户消息
  setStatus('thinking', '思考中');
  showStopButton(true);
  if (abortController) abortController.abort();
  abortController = new AbortController();
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID, content: [{ type: 'text', text }] }),
      signal: abortController.signal,
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));
          if (event.request_id) { currentRequestId = event.request_id; continue; }
          if (event.type === 'status' || (event.data && event.data.type === 'status')) {
            const st = event.data || event;
            handleLiveStatus(st);
            if (st.phase === 'confirm') {
              renderConfirmCard(lastAsstId, st.detail || '');
            }
            continue;
          }
          if (event.contents && Array.isArray(event.contents)) {
            const msgId = event.msg_id || 'msg0';
            messageBlocks.set(msgId, event.contents);
            if (!messageIdOrder.includes(msgId)) messageIdOrder.push(msgId);
            for (const c of event.contents) {
              if (c.type === 'tool_result' && lastAsstMsg) {
                const tc = (lastAsstMsg.toolCalls || []).find(t => t.id === c.tool_use_id);
                if (tc) {
                  tc.output = c.output;
                  tc.status = 'done';
                  updateToolCard(tc);
                  updateTimelineResult(tc);
                }
              }
            }
            // magic 命令结果直接推到最后一条 assistant 气泡
            if (lastAsstId && lastAsstMsg) rebuildAssistantMessage(lastAsstId, lastAsstMsg);
          }
          if (event.type === 'context_view' || (event.data && event.data.type === 'context_view')) {
            updateContextView(event.data || event);
            continue;
          }
        } catch (e) {}
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') console.error('[magic]', err.message);
  }
  showStopButton(false);
  setStatus('done', '完成');
}

function updateToolCard(tc) {

          return String(item);

// ====== Context Spectrum (核心差异化) ======
function updateContextView(data) {
  contextEmpty.style.display = 'none';
  contextData.style.display = 'block';

  const roundNum = data.round || contextRound;
  // 同一轮只保留一个块：每次调 API 推来的 context_view 更新同轮，不无限累积
  contextData.querySelectorAll('.context-round[data-round="' + roundNum + '"]').forEach(rd => rd.remove());
  const roundDiv = document.createElement('div');
  roundDiv.className = 'context-round';
  roundDiv.dataset.round = roundNum;
  roundDiv.style.cssText = 'border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden';

  // 本轮已出现过多次调 API：给轮次标题加个"实时发送"标记，区分于(最终)完整快照
  const isLiveSend = !!(data.full_messages && !data.token_stats && !data.full_system);
  const roundLabel = isLiveSend ? `第 ${roundNum} 轮 · 本次发送` : `第 ${roundNum} 轮`;

  let html = `<div style="padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;font-weight:600;color:var(--text-bright)">${roundLabel}</span>
    <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-mono)">${(data.timestamp || '').substring(11, 19)}</span>
  </div>`;

  html += '<div style="padding:10px">';

  // User input
  if (data.user_input) {
    html += `<div class="context-section">
      <div class="section-title">用户输入</div>
      <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:6px 10px;font-size:13px;color:var(--text);border-left:3px solid var(--accent)">
        ${escapeHtml(data.user_input.substring(0, 200))}
      </div>
    </div>`;
  }

  // 📜 完整 Prompt 检视器（模型本轮实际看到的全部 messages）
  if (data.full_messages && data.full_messages.length) {
    html += `<div class="context-section">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span>📜 完整 Prompt（共 ${data.full_messages.length} 块 · 模型真实所见）</span>
        <span class="prompt-toggle-all" onclick="toggleAllPromptBlocks(this)">全部展开 ▾</span>
      </div>
      <div class="prompt-blocks">`;
    data.full_messages.forEach((m, i) => {
      const role = (m.role || 'unknown').toLowerCase();
      const chars = (m.chars != null) ? m.chars : (m.content || '').length;
      const tag = role.toUpperCase();
      html += `<div class="prompt-block role-${role}">
        <div class="pb-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="pb-idx">#${i}</span>
          <span class="role-tag">${escapeHtml(tag)}</span>
          <span class="pb-chars">${chars.toLocaleString()} 字</span>
          <span class="pb-arrow">▶</span>
        </div>
        <div class="pb-body"><pre>${escapeHtml(m.content || '')}</pre></div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Tool calls in this round
  if (data.tool_calls && data.tool_calls.length) {
    html += `<div class="context-section">
      <div class="section-title">工具调用 (${data.tool_calls.length}次)</div>`;
    for (const t of data.tool_calls) {
      const params = JSON.stringify(t.params || t.parameters || {});
      const result = typeof t.result === 'string' ? t.result : JSON.stringify(t.result || '');
      html += `<div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:4px;border-left:3px solid var(--orange);font-size:12px">
        <div style="color:var(--orange);font-weight:600">Step ${t.step}: ${escapeHtml(t.tool || t.tool_name || '')}</div>
        <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;margin-top:2px">参数: ${escapeHtml(params.substring(0, 150))}</div>
        ${result ? `<div style="color:var(--success);font-size:11px;margin-top:2px">结果: ${escapeHtml(result)}</div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  // Token bar
  if (data.token_stats) {
    const ts = data.token_stats;
    const cls = ts.pct > 80 ? 'danger' : ts.pct > 60 ? 'warn' : 'safe';
    html += `<div class="token-bar">
      <div class="bar-label"><span>Token 预算</span><span>${ts.total?.toLocaleString() || 0} / ${ts.budget?.toLocaleString() || 0}</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.min(ts.pct||0,100)}%"></div></div>
      <div class="bar-detail"><span>Sys: ${ts.system?.toLocaleString()||0}</span><span>Hist: ${ts.history?.toLocaleString()||0}</span><span>${ts.pct||0}%</span></div>
    </div>`;
  }

  // System Prompt 完整全文（LLM 实际收到）
  if (data.full_system) {
    html += `<div class="context-section">
      <div class="section-title">📋 System Prompt 全文（LLM 实际收到）</div>
      <div class="context-block">
        <div class="block-header" onclick="this.parentElement.classList.toggle('open')">
          <span>📄 完整 System Prompt</span>
          <span class="size">${data.full_system.length.toLocaleString()}字</span>
        </div>
        <div class="block-body" style="max-height:500px">${escapeHtml(data.full_system)}</div>
      </div>
    </div>`;
  }

  // System prompt blocks (collapsible)
  if (data.system_blocks && data.system_blocks.length) {
    html += `<div class="context-section">
      <div class="section-title">System Prompt (${data.system_blocks.length}块)</div>`;
    for (const b of data.system_blocks) {
      html += `<div class="context-block">
        <div class="block-header" onclick="this.parentElement.classList.toggle('open')">
          <span>📄 ${escapeHtml(b.name)}</span>
          <span class="size">${b.chars?.toLocaleString()}字</span>
        </div>
        <div class="block-body">${escapeHtml(b.content || b.preview || '')}</div>
      </div>`;
    }
    html += `</div>`;
  }

  html += '</div>'; // close padding div
  roundDiv.innerHTML = html;
  contextData.appendChild(roundDiv);
  contextContent.scrollTop = contextContent.scrollHeight;
}

// 完整 Prompt 检视器：全部展开 / 折叠
function toggleAllPromptBlocks(btn) {
  const section = btn.closest('.context-section');
  if (!section) return;
  const blocks = section.querySelectorAll('.prompt-block');
  const expand = btn.dataset.expand !== 'true';
  blocks.forEach(b => b.classList.toggle('open', expand));
  btn.dataset.expand = expand ? 'true' : 'false';
  btn.textContent = expand ? '全部折叠 ▴' : '全部展开 ▾';
}

// ====== 多会话管理（左侧会话列表） ======
const SESSION_LIST_KEY = 'prism_harness_sessions';
const SESSION_ACTIVE_KEY = 'prism_harness_active';
const MAX_SESSION_SNAP = 600000;   // 单会话快照上限字节，防 localStorage 溢出

function loadSessions() {
  try {
    return JSON.parse(localStorage.getItem(SESSION_LIST_KEY)) || [];
  } catch (e) { return []; }
}
function saveSessions(list) {
  try { localStorage.setItem(SESSION_LIST_KEY, JSON.stringify(list)); }
  catch (e) { /* quota exceeded: 忽略静默失败 */ }
}
function activeSessionId() {
  return localStorage.getItem(SESSION_ACTIVE_KEY) || SESSION_ID;
}
function setActiveSessionId(id) {
  localStorage.setItem(SESSION_ACTIVE_KEY, id);
}
function findSession(id) {
  return loadSessions().find(s => s.id === id) || null;
}
function upsertSession(rec) {
  const list = loadSessions();
  const i = list.findIndex(s => s.id === rec.id);
  if (i >= 0) list[i] = Object.assign({}, list[i], rec);
  else list.push(rec);
  saveSessions(list);
}
function newSessionId() {
  return 'sess-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 捕获当前会话的界面快照（聊天/轨迹/上下文/工具面板）
function capturePanelStates() {
  const traceView = document.getElementById('traceView');
  return {
    chatHTML: chatMessages.innerHTML,
    viewMode: traceViewMode,
    traceSummary: (document.getElementById('traceSummary') || {}).textContent || '',
    traceLog: (document.getElementById('traceLog') || {}).innerHTML || '',
    contextHTML: (document.getElementById('contextData') || {}).innerHTML || '',
    contextEmptyShown: (document.getElementById('contextEmpty') || {}).style.display !== 'none',
    toolsHTML: (document.getElementById('toolsContent') || {}).innerHTML || '',
    pane: switchDetailPane._cur || 'context',
  };
}

function saveCurrentSessionState() {
  const rec = findSession(SESSION_ID) || { id: SESSION_ID, title: '新会话', createdAt: Date.now(), lastActive: Date.now() };
  Object.assign(rec, {
    title: deriveSessionTitle() || rec.title || '新会话',
    lastActive: Date.now(),
    ...capturePanelStates(),
  });
  // 控制快照体积，防止长会话把 localStorage 撑爆（各字段截断 + 总上限）
  const cap = (v, n) => (typeof v === 'string' && v.length > n) ? v.slice(0, n) : v;
  rec.chatHTML = cap(rec.chatHTML, MAX_SESSION_SNAP);
  rec.traceLog = cap(rec.traceLog, 120000);
  rec.traceSummary = cap(rec.traceSummary, 500);
  rec.contextHTML = cap(rec.contextHTML, 220000);
  rec.toolsHTML = cap(rec.toolsHTML, 120000);
  let total = 0;
  for (const k of ['chatHTML', 'traceLog', 'contextHTML', 'toolsHTML', 'traceSummary']) {
    total += String(rec[k] || '').length;
  }
  // 若整体仍超 1.2MB，优先丢上下文/工具/轨迹，保住聊天记录
  if (total > 1200000) {
    rec.contextHTML = ''; rec.toolsHTML = ''; rec.traceLog = ''; rec.traceSummary = '';
  }
  upsertSession(rec);
  renderSessionList();
}

function deriveSessionTitle() {
  // 用第一条用户消息做会话名
  const firstUser = chatMessages.querySelector('.msg.user .bubble');
  if (!firstUser) return '';
  const t = (firstUser.textContent || '').trim().replace(/\s+/g, ' ');
  return t.length > 18 ? t.slice(0, 18) + '…' : t;
}

function renderSessionList() {
  const listEl = document.getElementById('sessionList');
  if (!listEl) return;
  const active = activeSessionId();
  const list = loadSessions();
  if (!list.length) {
    listEl.innerHTML = '<div class="session-empty">还没有会话，点击上方「＋ 新会话」开始</div>';
    return;
  }
  listEl.innerHTML = list.map(s => {
    const time = new Date(s.lastActive || s.createdAt || Date.now());
    const hh = String(time.getHours()).padStart(2, '0');
    const mm = String(time.getMinutes()).padStart(2, '0');
    const title = (s.title || '新会话').replace(/[<>&]/g, '');
    const activeCls = s.id === active ? ' active' : '';
    return `<div class="session-item${activeCls}" data-sid="${s.id}" onclick="switchSession('${s.id}')">
      <div class="si-title" title="${title}">${title || '新会话'}</div>
      <div class="si-time">${hh}:${mm}</div>
      <span class="si-del" onclick="event.stopPropagation();deleteSession(event,'${s.id}')" title="删除会话">×</span>
    </div>`;
  }).join('');
}

// 清空当前界面 DOM + 运行时状态，准备切到另一个会话
function clearCurrentUI() {
  chatMessages.innerHTML = '';
  const contextData = document.getElementById('contextData');
  const contextEmpty = document.getElementById('contextEmpty');
  if (contextData) contextData.innerHTML = '';
  if (contextData) contextData.style.display = 'none';
  if (contextEmpty) contextEmpty.style.display = '';
  document.getElementById('toolsContent').innerHTML = '';
  const tl = document.getElementById('traceLog'); if (tl) tl.innerHTML = '';
  const ts = document.getElementById('traceSummary'); if (ts) ts.textContent = '等待轨迹数据…';
  // 重置运行时状态
  messages = []; toolCalls = []; messageBlocks = new Map();
  messageIdOrder = []; lastAsstId = ''; lastAsstMsg = null;
  currentTraceUserText = ''; toolStepCounter = 0; contextRound = 0;
  traceToolSteps = new Map();
  if (abortController) abortController.abort();
  showStopButton(false);
  showLiveStatus(false);
  setStatus('thinking', '就绪');
  switchView('chat');
  if (switchDetailPane) switchDetailPane('context');
}

function newSession() {
  // 先保存当前会话
  if (document.getElementById('chatMessages').children.length > 0) {
    saveCurrentSessionState();
  }
  const id = newSessionId();
  SESSION_ID = id;
  sessionStorage.setItem(SESSION_STORAGE_KEY, id);
  const rec = { id, title: '新会话', createdAt: Date.now(), lastActive: Date.now() };
  const list = loadSessions();
  list.push(rec);
  saveSessions(list);
  setActiveSessionId(id);
  clearCurrentUI();
  saveCurrentSessionState(); // 让列表里出现该会话
  renderSessionList();
}

function switchSession(id) {
  if (id === SESSION_ID) { renderSessionList(); return; }
  // 保存当前
  if (document.getElementById('chatMessages').children.length > 0) {
    saveCurrentSessionState();
  }
  const rec = findSession(id);
  if (!rec) return;
  SESSION_ID = id;
  sessionStorage.setItem(SESSION_STORAGE_KEY, id);
  setActiveSessionId(id);
  clearCurrentUI();
  // 恢复目标会话界面
  if (rec.chatHTML) document.getElementById('chatMessages').innerHTML = rec.chatHTML;
  const ts = document.getElementById('traceSummary'); if (ts && rec.traceSummary) ts.textContent = rec.traceSummary;
  const tl = document.getElementById('traceLog'); if (tl && rec.traceLog) tl.innerHTML = rec.traceLog;
  const cd = document.getElementById('contextData');
  const ce = document.getElementById('contextEmpty');
  if (cd && rec.contextHTML) { cd.innerHTML = rec.contextHTML; cd.style.display = 'block'; }
  if (ce) ce.style.display = (rec.contextEmptyShown === false) ? 'none' : '';
  const tco = document.getElementById('toolsContent'); if (tco && rec.toolsHTML) tco.innerHTML = rec.toolsHTML;
  if (rec.viewMode) { try { switchView(rec.viewMode); } catch (e) {} }
  if (rec.pane) { try { switchDetailPane(rec.pane); } catch (e) {} }
  renderSessionList();
  scrollChat();
}

function deleteSession(ev, id) {
  if (ev) ev.stopPropagation();
  if (!confirm('删除这个会话？')) return;
  let list = loadSessions();
  list = list.filter(s => s.id !== id);
  saveSessions(list);
  if (id === activeSessionId() || id === SESSION_ID) {
    // 删的是当前会话 → 若有剩余会话就切过去，否则新开会话
    const next = list[list.length - 1];
    if (next) switchSession(next.id);
    else newSession();
  } else {
    renderSessionList();
  }
}

// 视图/面板切换记录，用于会话快照恢复
(function(){
  const orig = switchDetailPane;
  if (typeof orig === 'function') {
    switchDetailPane = function(pane) {
      switchDetailPane._cur = pane;
      return orig.apply(this, arguments);
    };
  }
})();

// ====== 停止 / 打断 ======
const stopBtn = document.getElementById('stopBtn');
const liveStatusEl = document.getElementById('liveStatus');

function showStopButton(show) {
  stopBtn.style.display = show ? 'inline-block' : 'none';
}

// 实时状态指示（现在在哪、在干啥）
function showLiveStatus(show, text, cls) {
  if (show) {
    liveStatusEl.style.display = 'inline-flex';
    if (text) liveStatusEl.textContent = text;
    if (cls) liveStatusEl.className = 'badge ' + cls;
  } else {
    liveStatusEl.style.display = 'none';
  }
}

function handleLiveStatus(st) {
  const phase = st.phase || '';
  const detail = st.detail || '';
  // 更新工具栏实时状态条
  if (phase === 'thinking') {
    showLiveStatus(true, '🧠 思考中…', 'live');
  } else if (phase === 'reasoning') {
    const preview = (st.preview || detail || '').slice(-60);
    showLiveStatus(true, '🧠 ' + preview, 'reasoning');
  } else if (phase === 'acting') {
    showLiveStatus(true, '🔧 ' + detail, 'acting');
  } else if (phase === 'pending') {
    showLiveStatus(true, '🔒 待确认', 'pending');
  } else if (phase === 'confirm') {
    showLiveStatus(true, '🔒 待确认', 'pending');
  } else if (phase === 'heartbeat') {
    // 心跳：agent 还在工作，别让用户以为它死了
    showLiveStatus(true, '⏳ ' + detail, 'live');
  } else if (phase === 'max_iters') {
    showLiveStatus(true, '⚠️ ' + detail, 'pending');
  } else if (phase === 'error') {
    showLiveStatus(true, '❌ ' + detail, 'pending');
  } else if (phase === 'paused') {
    showLiveStatus(true, '🔒 ' + detail, 'pending');
  } else if (phase === 'done') {
    showLiveStatus(false);
  }
}

async function stopGeneration() {
  if (!currentRequestId) return;
  _stopped = true;
  if (abortController) abortController.abort();
  showStopButton(false);
  setStatus('stopped', '已停止');
  // 2) 通知后端真正打断 agent 生成
  try {
    const resp = await fetch(`/stop?session_id=${encodeURIComponent(SESSION_ID)}&request_id=${encodeURIComponent(currentRequestId)}`, { method: 'GET' });
    const r = await resp.json();
    console.log('[stop]', r);
  } catch (e) {
    console.warn('[stop] request failed', e);
  }
}

function escapeHtml(s) {
  if (!s) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  if (!text) return '';
  let s = escapeHtml(text);
  // Code blocks
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Headers
  s = s.replace(/^### (.+)$/gm, '<h4 style="margin:8px 0 4px">$1</h4>');
  s = s.replace(/^## (.+)$/gm, '<h3 style="margin:10px 0 4px">$1</h3>');
  // Lists
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  // Line breaks
  s = s.replace(/\n/g, '<br>');
  return s;
}

// Focus input on load
switchView('chat');
switchDetailPane('context');

// ====== 多会话初始化与自动快照 ======
(function initSessionList() {
  // 把当前 SESSION_ID 纳入列表（若尚未记录）
  const list = loadSessions();
  if (!list.find(s => s.id === SESSION_ID)) {
    list.push({ id: SESSION_ID, title: '新会话', createdAt: Date.now(), lastActive: Date.now() });
    saveSessions(list);
  }
  setActiveSessionId(SESSION_ID);
  renderSessionList();

  // 防抖保存：聊天/轨迹/上下文/工具任一 DOM 变化 → 定时快照当前会话
  let snapTimer = null;
  const scheduleSnap = () => {
    if (snapTimer) clearTimeout(snapTimer);
    snapTimer = setTimeout(() => {
      snapTimer = null;
      if (SESSION_ID) saveCurrentSessionState();
    }, 400);
  };
  const targets = [
    document.getElementById('chatMessages'),
    document.getElementById('traceLog'),
    document.getElementById('contextData'),
    document.getElementById('toolsContent'),
  ].filter(Boolean);
  const mo = new MutationObserver(scheduleSnap);
  targets.forEach(t => mo.observe(t, { childList: true, subtree: true, characterData: true }));
})();
</script>
