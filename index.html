<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrismClaw Agent — 透明 AI 助手</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117; --bg-panel:#161822; --bg-card:#1c1e2e;
  --bg-input:#141520; --border:#2a2d3e; --border-active:#4a4d6e;
  --text:#d4d6e0; --text-dim:#7a7d8e; --text-bright:#f0f1f8;
  --accent:#6c8cff; --accent-glow:rgba(108,140,255,0.15);
  --success:#4ade80; --warn:#f59e0b; --danger:#f87171;
  --orange:#ff9800; --purple:#a78bfa; --cyan:#22d3ee;
  --font-mono:'Cascadia Code','Fira Code','JetBrains Mono',monospace;
  --font-sans:'Inter',-apple-system,sans-serif;
  --radius:8px; --radius-sm:4px; --transition:0.2s ease;
}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh;flex-direction:column}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;
  background:var(--bg-panel);border-bottom:1px solid var(--border);min-height:48px}
.toolbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
  color:var(--text-bright)}
.toolbar .brand .icon{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--purple));
  border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.toolbar .actions{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--bg-card);color:var(--text);cursor:pointer;font-size:13px;transition:var(--transition)}
.btn:hover{background:var(--border);color:var(--text-bright)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{opacity:0.9}

/* Main Panels */
.main{display:flex;flex:1;overflow:hidden}
.panel{border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden}
.panel:last-child{border-right:none}

/* Panel 1: Chat */
.panel-chat{flex:2;min-width:340px;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.chat-messages::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-panel)}
.chat-input{display:flex;gap:8px}
.chat-input textarea{flex:1;background:var(--bg-input);border:1px solid var(--border);
  color:var(--text);padding:10px 14px;border-radius:var(--radius);resize:none;
  font-family:var(--font-sans);font-size:14px;min-height:44px;max-height:120px}
.chat-input textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.chat-input textarea::placeholder{color:var(--text-dim)}

/* Message bubbles */
.msg{margin-bottom:16px;animation:fadeIn 0.25s ease}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--accent);color:#fff;max-width:80%;border-radius:12px 4px 12px 12px}
.msg.assistant .bubble{background:var(--bg-card);max-width:85%;border-radius:4px 12px 12px 12px;
  border:1px solid var(--border)}
.msg.system .bubble{background:transparent;max-width:90%;font-style:italic;color:var(--text-dim);
  font-size:13px;text-align:center}
.bubble{padding:10px 14px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble code{background:rgba(0,0,0,0.2);padding:1px 5px;border-radius:3px;font-family:var(--font-mono);font-size:12px}
.bubble pre{background:rgba(0,0,0,0.3);padding:10px;border-radius:6px;overflow-x:auto;margin:6px 0;
  font-size:12px;line-height:1.5}
.bubble pre code{background:none;padding:0}

/* Tool card */
.tool-card{margin:6px 0;border-radius:var(--radius);border-left:3px solid var(--orange);
  background:rgba(255,152,0,0.08);overflow:hidden;font-size:13px}
.tool-card .tool-header{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  color:var(--orange);font-weight:600;user-select:none}
.tool-card .tool-header .arrow{transition:transform 0.2s;font-size:10px}
.tool-card.open .tool-header .arrow{transform:rotate(90deg)}
.tool-card .tool-body{display:none;padding:8px 12px 10px;font-family:var(--font-mono);font-size:12px;
  color:var(--text-dim);border-top:1px solid rgba(255,152,0,0.15);max-height:200px;overflow-y:auto}
.tool-card.open .tool-body{display:block}
.tool-card .tool-body .result-label{color:var(--success);margin-top:6px;font-weight:600}
.tool-card.loading .tool-header::after{content:'';display:inline-block;width:100px;height:3px;
  background:linear-gradient(90deg,var(--orange),transparent);animation:shimmer 1.5s infinite;
  border-radius:2px;margin-left:auto}
@keyframes shimmer{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}

/* HITL confirm */
.confirm-card{border-left-color:var(--warn)!important;background:rgba(245,158,11,0.08)!important}
.confirm-card .tool-header{color:var(--warn)!important}
.confirm-card .confirm-actions{display:flex;gap:8px;padding:4px 12px 10px}
.confirm-card .confirm-actions .btn{font-size:12px;padding:4px 10px}

/* Panel 2: Context Spectrum (核心创新) */
.panel-context{flex:2;min-width:300px;background:var(--bg-panel);display:flex;flex-direction:column}
.panel-context .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);
  color:var(--text-bright);font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:0.05em;display:flex;align-items:center;gap:8px}
.panel-context .panel-header .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.context-content{flex:1;overflow-y:auto;padding:12px}
.context-content::-webkit-scrollbar{width:4px}
.context-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.context-section{margin-bottom:14px}
.context-section .section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--text-dim);margin-bottom:8px;font-weight:600}
.context-block{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:6px;overflow:hidden}
.context-block .block-header{padding:6px 10px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-size:12px;color:var(--text);user-select:none}
.context-block .block-header:hover{background:rgba(255,255,255,0.02)}
.context-block .block-header .size{color:var(--text-dim);font-family:var(--font-mono);font-size:10px}
.context-block .block-body{display:none;padding:8px 10px;font-size:11px;font-family:var(--font-mono);
  color:var(--text-dim);line-height:1.6;border-top:1px solid var(--border);
  max-height:200px;overflow-y:auto;white-space:pre-wrap}
.context-block.open .block-body{display:block}
.context-blocks.collapsed .context-block .block-body{display:none!important}

/* Token bar */
.token-bar{margin:10px 0;padding:10px;background:var(--bg-card);border-radius:var(--radius);
  border:1px solid var(--border)}
.token-bar .bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:4px}
.token-bar .bar-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.token-bar .bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.token-bar .bar-fill.safe{background:var(--success)}
.token-bar .bar-fill.warn{background:var(--warn)}
.token-bar .bar-fill.danger{background:var(--danger)}
.token-bar .bar-detail{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;
  font-family:var(--font-mono)}

.context-empty{display:flex;align-items:center;justify-content:center;height:60%;
  color:var(--text-dim);font-size:14px;text-align:center;line-height:1.8;
  flex-direction:column;gap:12px}
.context-empty .prismclaw-icon{font-size:48px;opacity:0.3}

/* Panel 3: Tools & Logs */
.panel-tools{flex:1.4;min-width:260px;background:var(--bg-panel);display:flex;flex-direction:column}
.panel-tools .panel-header{padding:12px 16px;border-bottom:1px solid var(--border);
  color:var(--text-bright);font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:0.05em}
.tools-content{flex:1;overflow-y:auto;padding:12px}
.tools-content::-webkit-scrollbar{width:4px}
.tools-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tool-timeline{position:relative;padding-left:16px}
.tool-timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:12px;padding-left:14px}
.timeline-item::before{content:'';position:absolute;left:-14px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--border)}
.timeline-item.active::before{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.timeline-item .tl-time{font-size:10px;color:var(--text-dim);font-family:var(--font-mono)}
.timeline-item .tl-tool{font-size:13px;font-weight:600;color:var(--text)}
.timeline-item .tl-detail{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);
  margin-top:2px;max-height:80px;overflow-y:auto}

/* Full Prompt inspector (完整 Prompt 检视器) */
.prompt-blocks{margin-top:4px}
.prompt-block{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:6px;overflow:hidden}
.prompt-block .pb-header{padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;
  font-size:12px;user-select:none}
.prompt-block .pb-header:hover{background:rgba(255,255,255,0.02)}
.prompt-block .role-tag{font-weight:700;font-size:10px;padding:2px 7px;border-radius:4px;
  font-family:var(--font-mono);letter-spacing:0.04em;flex-shrink:0}
.prompt-block .pb-idx{color:var(--text-dim);font-family:var(--font-mono);font-size:10px;flex-shrink:0}
.prompt-block .pb-chars{color:var(--text-dim);font-family:var(--font-mono);font-size:10px;margin-left:auto}
.prompt-block .pb-arrow{color:var(--text-dim);font-size:10px;transition:transform 0.2s;flex-shrink:0}
.prompt-block.open .pb-arrow{transform:rotate(90deg)}
.prompt-block .pb-body{display:none;padding:8px 10px;border-top:1px solid var(--border);
  max-height:340px;overflow:auto}
.prompt-block.open .pb-body{display:block}
.prompt-block .pb-body pre{white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);
  font-size:11px;color:var(--text-dim);line-height:1.55;margin:0}
.prompt-block.role-system{border-left:3px solid var(--purple)}
.prompt-block.role-system .role-tag{background:rgba(167,139,250,0.18);color:var(--purple)}
.prompt-block.role-user{border-left:3px solid var(--accent)}
.prompt-block.role-user .role-tag{background:rgba(108,140,255,0.18);color:var(--accent)}
.prompt-block.role-assistant{border-left:3px solid var(--success)}
.prompt-block.role-assistant .role-tag{background:rgba(74,222,128,0.18);color:var(--success)}
.prompt-block.role-tool{border-left:3px solid var(--orange)}
.prompt-block.role-tool .role-tag{background:rgba(255,152,0,0.18);color:var(--orange)}
.prompt-block.role-tool .pb-body pre{color:var(--orange)}
.prompt-toggle-all{color:var(--accent);font-size:10px;cursor:pointer;font-weight:600}

/* Context view event */
.context-event{border-top:1px dashed var(--border);margin-top:8px;padding-top:8px}

/* Loading indicator */
.loading-dots{display:inline-flex;gap:4px;padding:4px 0}
.loading-dots span{width:4px;height:4px;border-radius:50%;background:var(--text-dim);animation:bounce 1.4s infinite}
.loading-dots span:nth-child(2){animation-delay:0.2s}
.loading-dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{opacity:0.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* Status badge */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;
  font-size:10px;font-weight:600;text-transform:uppercase}
.badge.thinking{background:rgba(108,140,255,0.15);color:var(--accent)}
.badge.acting{background:rgba(255,152,0,0.15);color:var(--orange)}
.badge.done{background:rgba(74,222,128,0.15);color:var(--success)}
.badge.stopped{background:rgba(248,113,113,0.15);color:var(--danger)}
.badge.pending{background:rgba(245,158,11,0.15);color:var(--warn)}
.badge.live{background:rgba(108,140,255,0.15);color:var(--accent)}
.badge.reasoning{background:rgba(167,139,250,0.15);color:var(--purple)}
</style>
</head>
<body>
<div class="app">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="brand">
      <div class="icon">💎</div>
      <span>PrismClaw Agent</span>
    </div>
    <div class="actions">
      <span id="statusBadge" class="badge thinking">就绪</span>
      <span id="liveStatus" class="badge" style="display:none"></span>
      <button class="btn" id="stopBtn" onclick="stopGeneration()" style="display:none" title="打断当前生成">⏹ 停止</button>
      <button class="btn" onclick="resetChat()" title="新会话">新会话</button>
    </div>
  </div>

  <!-- Main Panels -->
  <div class="main">
    <!-- Panel 1: Chat -->
    <div class="panel panel-chat" id="chatPanel">
      <div class="chat-messages" id="chatMessages">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:14px;flex-direction:column;gap:10px">
          <div style="font-size:40px;opacity:0.3">💎</div>
          <div>开始对话，观察 PrismClaw 的思考过程</div>
          <div style="font-size:12px">右侧面板展示每轮 Agent 实际"看到"的上下文</div>
        </div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input">
          <textarea id="userInput" placeholder="输入消息... (Enter发送, Shift+Enter换行)"
            rows="1" onkeydown="onInputKey(event)"></textarea>
          <button class="btn accent" onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
      </div>
    </div>

    <!-- Panel 2: Context Spectrum (核心创新) -->
    <div class="panel panel-context" id="contextPanel">
      <div class="panel-header">
        <div class="dot"></div> 上下文光谱 Context Spectrum
      </div>
      <div class="context-content" id="contextContent">
        <div class="context-empty" id="contextEmpty">
          <div class="prismclaw-icon">🔮</div>
          <div>Agent 看到的内容<br>将在这里逐轮展示</div>
        </div>
        <div id="contextData" style="display:none"></div>
      </div>
    </div>

    <!-- Panel 3: Tools & Logs -->
    <div class="panel panel-tools" id="toolsPanel">
      <div class="panel-header">工具调用 Tools & Logs</div>
      <div class="tools-content" id="toolsContent">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-size:13px;flex-direction:column;gap:8px">
          <div style="font-size:32px;opacity:0.2">🔧</div>
          <div>工具调用记录</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ====== State ======
const SESSION_ID = 'default';
let currentRequestId = null;
let messages = [];
let toolCalls = [];
let contextRound = 0;
let abortController = null;
let messageBlocks = new Map();    // msg_id -> latest contents[]
let lastAsstId = '';              // magic 命令复用最后一条 assistant 气泡
let lastAsstMsg = null;
let messageIdOrder = [];          // msg_id order
let _stopped = false;             // 用户点了停止，阻止 sendMessage 收尾覆盖状态

// ====== DOM ======
const chatMessages = document.getElementById('chatMessages');
const contextContent = document.getElementById('contextContent');
const contextData = document.getElementById('contextData');
const contextEmpty = document.getElementById('contextEmpty');
const toolsContent = document.getElementById('toolsContent');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const statusBadge = document.getElementById('statusBadge');

// ====== Send ======
function onInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize() {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}
userInput.addEventListener('input', autoResize);

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  setStatus('thinking', '思考中');
  showStopButton(true);   // 流式进行中 → 显示停止按钮
  showLiveStatus(false);

  // Add user message
  addUserMessage(text);
  messages.push({ role: 'user', content: text, contents: [] });

  // Create assistant message placeholder
  const asstId = addAssistantMessage('', true);
  const asstMsg = { role: 'assistant', content: '', contents: [], toolCalls: [] };
  lastAsstId = asstId;      // magic 命令复用
  lastAsstMsg = asstMsg;

  // Reset round
  contextRound++;
  toolCalls = [];
  messageBlocks = new Map();
  messageIdOrder = [];

  // SSE request
  if (abortController) abortController.abort();
  abortController = new AbortController();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: SESSION_ID,
        content: [{ type: 'text', text }],
      }),
      signal: abortController.signal,
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));

          if (event.request_id) {
            currentRequestId = event.request_id;
            continue;
          }

          if (event.cancel) {
            updateAssistantContent(asstId, '\n\n[已取消]');
            setStatus('stopped', '已停止');
            break;
          }

          // 实时状态：现在在哪、在干啥
          if (event.type === 'status' || (event.data && event.data.type === 'status')) {
            const st = event.data || event;
            handleLiveStatus(st);
            // guard 发的专门确认事件 → 直接渲染卡片，不靠文本猜
            if (st.phase === 'confirm') {
              renderConfirmCard(asstId, st.detail || '');
            }
            continue;
          }

          if (event.error) {
            updateAssistantContent(asstId, `\n\n❌ 错误: ${event.error}`);
            setStatus('stopped', '出错');
            break;
          }

          // Handle context_view event
          if (event.type === 'context_view' || (event.data && event.data.type === 'context_view')) {
            const ctxData = event.data || event;
            updateContextView(ctxData);
            continue;
          }

          // Process contents via messageBlocks (AgentScope sends accumulated text per msg_id)
          if (event.contents && Array.isArray(event.contents)) {
            const msgId = event.msg_id || 'msg0';
            messageBlocks.set(msgId, event.contents);
            if (!messageIdOrder.includes(msgId)) {
              messageIdOrder.push(msgId);
            }
            // Rebuild from all msg_ids (latest content for each)
            rebuildAssistantMessage(asstId, asstMsg);
          }

          if (event.last) {
            // Don't break — context_view and other events may follow in same buffer
            setStatus('done', '完成');
          }
        } catch (e) { /* skip parse errors */ }
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      let hint = '❌ 连接失败';
      if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
        hint = '❌ 无法连接服务器 — 请确认 launch.bat 正在运行（端口 8765）';
      } else if (err.message.includes('HTTP')) {
        hint = `❌ 服务器错误 (${err.message})`;
      }
      updateAssistantContent(asstId, `\n\n${hint}`);
    }
  }

  sendBtn.disabled = false;
  showStopButton(false);
  if (!_stopped) setStatus('done', '完成');
  _stopped = false;  // 重置，下一轮可用
}

// ====== Rebuild message from messageBlocks ======
function rebuildAssistantMessage(asstId, asstMsg) {
  let allText = '';
  let seenToolUses = new Set();
  let seenToolResults = new Set();

  // Iterate msg_ids in order
  for (const mid of messageIdOrder) {
    const contents = messageBlocks.get(mid) || [];
    for (const item of contents) {
      if (item.type === 'text') {
        // Text is accumulated - use latest from this msg_id only
      }
      else if (item.type === 'tool_use') {
        const id = item.tool_use_id;
        if (!seenToolUses.has(id)) {
          seenToolUses.add(id);
          setStatus('acting', '执行工具');
          let tc = (asstMsg.toolCalls || []).find(t => t.id === id);
          if (!tc) {
            // 新工具调用
            tc = {
              id: id,
              name: item.name || '',
              input: item.input || {},
              output: null,
              status: 'loading',
            };
            asstMsg.toolCalls = asstMsg.toolCalls || [];
            asstMsg.toolCalls.push(tc);
            toolCalls.push(tc);
            addToolCard(asstId, tc);
            updateTimeline(tc);
          } else if (item.input) {
            // 已存在：流式后期 input 更完整，覆盖更新
            // 不能只比 key 数量——{"query":""} 和 {"query":"深圳"} 都是 1 个 key，
            // 但后者值更完整。用序列化长度比较，更长才覆盖。
            const oldStr = JSON.stringify(tc.input || {});
            const newStr = JSON.stringify(item.input);
            if (newStr.length > oldStr.length) {
              tc.input = item.input;
              updateToolCardInput(tc);
            }
          }
        }
      }
      else if (item.type === 'tool_result') {
        const id = item.tool_use_id;
        if (!seenToolResults.has(id)) {
          seenToolResults.add(id);
          const tc = findToolCall(id, asstMsg);
          if (tc) {
            tc.output = item.output;
            tc.status = 'done';
            updateToolCard(tc);
            updateTimelineResult(tc);
          }
        }
      }
    }
  }

  // Extract text: get the text from the LAST msg_id's contents (accumulated)
  // Each msg_id may have its own text blocks; take the concatenated text
  // from each msg_id's latest content
  for (const mid of messageIdOrder) {
    const contents = messageBlocks.get(mid) || [];
    for (const item of contents) {
      if (item.type === 'text') {
        allText += item.content;
      }
    }
  }

  // If last msg_id has only text, just use it (prevent duplication from older msg_ids)
  // AgentScope pattern: each msg_id has full accumulated text from its own reasoning call
  // So concatenating across msg_ids is correct for multi-reasoning rounds
  if (allText !== asstMsg.content) {
    asstMsg.content = allText;
    updateAssistantContent(asstId, allText);
  }
}

function findToolCall(id, asstMsg) {
  if (!asstMsg.toolCalls) return null;
  return asstMsg.toolCalls.find(t => t.id === id);
}

// ====== Chat rendering ======
function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatMessages.appendChild(div);
  scrollChat();
}

function addAssistantMessage(content, loading) {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'asst-' + Date.now();
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.id = div.id + '-bubble';
  bubble.innerHTML = loading ? '<div class="loading-dots"><span></span><span></span><span></span></div>'
    : renderMarkdown(content);
  div.appendChild(bubble);
  chatMessages.appendChild(div);
  scrollChat();
  return div.id;
}

function updateAssistantContent(asstId, content) {
  const bubble = document.getElementById(asstId + '-bubble');
  if (bubble) {
    bubble.innerHTML = renderMarkdown(content);
  }
  maybeRenderConfirm(asstId, content);
  scrollChat();
}

// guard 通过 status 事件发的确认卡片（可靠，不靠文本匹配）
function renderConfirmCard(asstId, detail) {
  const div = document.getElementById(asstId);
  if (!div) return;
  // 移除旧确认卡片（避免重复）
  div.querySelectorAll('.confirm-card').forEach(c => c.remove());
  const card = document.createElement('div');
  card.className = 'tool-card confirm-card';
  card.innerHTML = `
    <div class="tool-header"><span class="arrow">▶</span> 🔒 需要你的确认</div>
    <div style="padding:6px 12px;font-size:12px;color:var(--text-dim);white-space:pre-wrap">${escapeHtml(detail)}</div>
    <div class="confirm-actions">
      <button class="btn accent" onclick="sendMagic('/approve')">✓ 允许执行</button>
      <button class="btn" onclick="sendMagic('/approve_all')" style="background:var(--success);color:#fff">⚡ 允许全部</button>
      <button class="btn" onclick="sendMagic('/reject')">✕ 拒绝</button>
    </div>`;
  // 贴到最近一个 tool card 后面（不限"执行中"状态——guard 可能已改为"等待确认"）
  const toolCards = div.querySelectorAll('.tool-card:not(.confirm-card)');
  if (toolCards.length > 0) {
    const anchor = toolCards[toolCards.length - 1];
    if (anchor.nextSibling) div.insertBefore(card, anchor.nextSibling);
    else div.appendChild(card);
  } else {
    div.appendChild(card);
  }
  scrollChat();
}

// 兜底：assistant 文本里出现确认表述时也渲染（旧路径，模型若绕过 guard 自写文本）
function maybeRenderConfirm(asstId, content) {
  const div = document.getElementById(asstId);
  if (!div) return;
  if (div.dataset.confirmRendered === 'true') return;  // 只渲染一次
  if (!content) return;
  // 只匹配 guard 官方确认模板（🔒 开头 + "工具调用需要确认"），不匹配模型自由文本
  if (!content.includes('🔒') || !content.includes('工具调用需要确认')) return;
  div.dataset.confirmRendered = 'true';
  const card = document.createElement('div');
  card.className = 'tool-card confirm-card';
  card.id = asstId + '-confirm';
  card.innerHTML = `
    <div class="tool-header"><span class="arrow">▶</span> 🔒 需要你的确认</div>
    <div class="confirm-actions">
      <button class="btn accent" onclick="sendMagic('/approve')">✓ 允许执行</button>
      <button class="btn" onclick="sendMagic('/approve_all')" style="background:var(--success);color:#fff">⚡ 允许全部</button>
      <button class="btn" onclick="sendMagic('/reject')">✕ 拒绝</button>
    </div>`;

  // 贴到最近一个 tool card 后面
  const toolCards = div.querySelectorAll('.tool-card:not(.confirm-card)');
  if (toolCards.length > 0) {
    const anchor = toolCards[toolCards.length - 1];
    if (anchor.nextSibling) div.insertBefore(card, anchor.nextSibling);
    else div.appendChild(card);
  } else {
    div.appendChild(card);
  }
  scrollChat();
}

// 发送 /approve 或 /reject —— 走 /chat（和正常消息一样）。
// approve 是正常请求：handle_magic_command 改 pending 状态，
// 然后这个请求的 agent reply 会读到 APPROVED 并重放工具执行。
async function sendMagic(cmd) {
  const text = cmd.trim();
  if (!text) return;
  // 立即把确认卡片置灰
  document.querySelectorAll('.confirm-card').forEach(c => {
    c.style.opacity = '0.5';
    c.style.pointerEvents = 'none';
    c.querySelectorAll('button').forEach(b => b.remove());
  });
  // 复用当前气泡：设置输入框后直接发 SSE，不建新用户消息
  setStatus('thinking', '思考中');
  showStopButton(true);
  if (abortController) abortController.abort();
  abortController = new AbortController();
  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID, content: [{ type: 'text', text }] }),
      signal: abortController.signal,
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));
          if (event.request_id) { currentRequestId = event.request_id; continue; }
          if (event.type === 'status' || (event.data && event.data.type === 'status')) {
            const st = event.data || event;
            handleLiveStatus(st);
            if (st.phase === 'confirm') {
              renderConfirmCard(lastAsstId, st.detail || '');
            }
            continue;
          }
          if (event.contents && Array.isArray(event.contents)) {
            const msgId = event.msg_id || 'msg0';
            messageBlocks.set(msgId, event.contents);
            if (!messageIdOrder.includes(msgId)) messageIdOrder.push(msgId);
            // magic 命令结果直接推到最后一条 assistant 气泡
            if (lastAsstId && lastAsstMsg) rebuildAssistantMessage(lastAsstId, lastAsstMsg);
          }
          if (event.type === 'context_view' || (event.data && event.data.type === 'context_view')) {
            updateContextView(event.data || event);
            continue;
          }
        } catch (e) {}
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') console.error('[magic]', err.message);
  }
  showStopButton(false);
  setStatus('done', '完成');
}

function addToolCard(asstId, tc) {
  const div = document.getElementById(asstId);
  if (!div) return;
  const card = document.createElement('div');
  card.className = 'tool-card loading';
  card.id = 'tc-' + tc.id;
  const paramStr = JSON.stringify(tc.input, null, 2).substring(0, 300);
  card.innerHTML = `
    <div class="tool-header" onclick="toggleToolCard('${tc.id}')">
      <span class="arrow">▶</span> 🔧 <code>${escapeHtml(tc.name)}</code>
    </div>
    <div class="tool-body">
      <div style="color:var(--text-dim)">参数:</div>
      <pre style="margin:4px 0;font-size:11px;background:rgba(0,0,0,0.2);padding:6px;border-radius:4px;overflow-x:auto">${escapeHtml(paramStr)}</pre>
      <div class="result-label" id="tc-${tc.id}-result">⏳ 执行中...</div>
    </div>`;
  div.appendChild(card);
  scrollChat();
}

// 更新工具卡的参数显示（流式后期 input 更完整时覆盖）
function updateToolCardInput(tc) {
  const card = document.getElementById('tc-' + tc.id);
  if (!card) return;
  const pre = card.querySelector('.tool-body pre');
  if (pre) {
    pre.textContent = JSON.stringify(tc.input, null, 2).substring(0, 300);
  }
  // 更新时间线详情
  const tlDetail = document.getElementById('tl-' + tc.id + '-detail');
  if (tlDetail) {
    tlDetail.textContent = '参数: ' + JSON.stringify(tc.input || {}).substring(0, 120);
  }
}

function updateToolCard(tc) {
  const card = document.getElementById('tc-' + tc.id);
  if (!card) return;
  card.classList.remove('loading');
  const resultEl = document.getElementById('tc-' + tc.id + '-result');
  if (resultEl) {
    let output = tc.output;
    if (typeof output !== 'string') {
      output = JSON.stringify(output);
    }
    // Clean up nested JSON if present
    try {
      const parsed = JSON.parse(output);
      if (Array.isArray(parsed)) {
        output = parsed.map(item => {
          if (typeof item === 'object') return item.text || item.content || JSON.stringify(item);
          return String(item);
        }).join('\n');
      }
    } catch(e) { /* not JSON, keep as is */ }
    resultEl.textContent = '✅ 结果: ' + (output || '(空)');
  }
  scrollChat();
}

function toggleToolCard(id) {
  document.getElementById('tc-' + id)?.classList.toggle('open');
}

// ====== Context Spectrum (核心差异化) ======
function updateContextView(data) {
  contextEmpty.style.display = 'none';
  contextData.style.display = 'block';

  const roundNum = data.round || contextRound;
  const roundDiv = document.createElement('div');
  roundDiv.className = 'context-round';
  roundDiv.style.cssText = 'border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden';

  let html = `<div style="padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:13px;font-weight:600;color:var(--text-bright)">第 ${roundNum} 轮</span>
    <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-mono)">${(data.timestamp || '').substring(11, 19)}</span>
  </div>`;

  html += '<div style="padding:10px">';

  // User input
  if (data.user_input) {
    html += `<div class="context-section">
      <div class="section-title">用户输入</div>
      <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:6px 10px;font-size:13px;color:var(--text);border-left:3px solid var(--accent)">
        ${escapeHtml(data.user_input.substring(0, 200))}
      </div>
    </div>`;
  }

  // 📜 完整 Prompt 检视器（模型本轮实际看到的全部 messages）
  if (data.full_messages && data.full_messages.length) {
    html += `<div class="context-section">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span>📜 完整 Prompt（共 ${data.full_messages.length} 块 · 模型真实所见）</span>
        <span class="prompt-toggle-all" onclick="toggleAllPromptBlocks(this)">全部展开 ▾</span>
      </div>
      <div class="prompt-blocks">`;
    data.full_messages.forEach((m, i) => {
      const role = (m.role || 'unknown').toLowerCase();
      const chars = (m.chars != null) ? m.chars : (m.content || '').length;
      const tag = role.toUpperCase();
      html += `<div class="prompt-block role-${role}">
        <div class="pb-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="pb-idx">#${i}</span>
          <span class="role-tag">${escapeHtml(tag)}</span>
          <span class="pb-chars">${chars.toLocaleString()} 字</span>
          <span class="pb-arrow">▶</span>
        </div>
        <div class="pb-body"><pre>${escapeHtml(m.content || '')}</pre></div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // Tool calls in this round
  if (data.tool_calls && data.tool_calls.length) {
    html += `<div class="context-section">
      <div class="section-title">工具调用 (${data.tool_calls.length}次)</div>`;
    for (const t of data.tool_calls) {
      const params = JSON.stringify(t.params || t.parameters || {});
      const result = typeof t.result === 'string' ? t.result : JSON.stringify(t.result || '');
      html += `<div style="background:var(--bg-card);border-radius:var(--radius-sm);padding:6px 10px;margin-bottom:4px;border-left:3px solid var(--orange);font-size:12px">
        <div style="color:var(--orange);font-weight:600">Step ${t.step}: ${escapeHtml(t.tool || t.tool_name || '')}</div>
        <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;margin-top:2px">参数: ${escapeHtml(params.substring(0, 150))}</div>
        ${result ? `<div style="color:var(--success);font-size:11px;margin-top:2px">结果: ${escapeHtml(result)}</div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  // Token bar
  if (data.token_stats) {
    const ts = data.token_stats;
    const cls = ts.pct > 80 ? 'danger' : ts.pct > 60 ? 'warn' : 'safe';
    html += `<div class="token-bar">
      <div class="bar-label"><span>Token 预算</span><span>${ts.total?.toLocaleString() || 0} / ${ts.budget?.toLocaleString() || 0}</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.min(ts.pct||0,100)}%"></div></div>
      <div class="bar-detail"><span>Sys: ${ts.system?.toLocaleString()||0}</span><span>Hist: ${ts.history?.toLocaleString()||0}</span><span>${ts.pct||0}%</span></div>
    </div>`;
  }

  // System Prompt 完整全文（LLM 实际收到）
  if (data.full_system) {
    html += `<div class="context-section">
      <div class="section-title">📋 System Prompt 全文（LLM 实际收到）</div>
      <div class="context-block">
        <div class="block-header" onclick="this.parentElement.classList.toggle('open')">
          <span>📄 完整 System Prompt</span>
          <span class="size">${data.full_system.length.toLocaleString()}字</span>
        </div>
        <div class="block-body" style="max-height:500px">${escapeHtml(data.full_system)}</div>
      </div>
    </div>`;
  }

  // System prompt blocks (collapsible)
  if (data.system_blocks && data.system_blocks.length) {
    html += `<div class="context-section">
      <div class="section-title">System Prompt (${data.system_blocks.length}块)</div>`;
    for (const b of data.system_blocks) {
      html += `<div class="context-block">
        <div class="block-header" onclick="this.parentElement.classList.toggle('open')">
          <span>📄 ${escapeHtml(b.name)}</span>
          <span class="size">${b.chars?.toLocaleString()}字</span>
        </div>
        <div class="block-body">${escapeHtml(b.content || b.preview || '')}</div>
      </div>`;
    }
    html += `</div>`;
  }

  html += '</div>'; // close padding div
  roundDiv.innerHTML = html;
  contextData.appendChild(roundDiv);
  contextContent.scrollTop = contextContent.scrollHeight;
}

// 完整 Prompt 检视器：全部展开 / 折叠
function toggleAllPromptBlocks(btn) {
  const section = btn.closest('.context-section');
  if (!section) return;
  const blocks = section.querySelectorAll('.prompt-block');
  const expand = btn.dataset.expand !== 'true';
  blocks.forEach(b => b.classList.toggle('open', expand));
  btn.dataset.expand = expand ? 'true' : 'false';
  btn.textContent = expand ? '全部折叠 ▴' : '全部展开 ▾';
}

// ====== Tool Timeline ======
let toolStepCounter = 0;

function clearToolTimeline() {
  toolsContent.innerHTML = '<div class="tool-timeline" id="toolTimeline"></div>';
  toolStepCounter = 0;
}

function updateTimeline(tc) {
  // Remove empty placeholder if present
  const placeholder = toolsContent.querySelector('div[style*="justify-content:center"]');
  if (placeholder) {
    toolsContent.innerHTML = '<div class="tool-timeline" id="toolTimeline"></div>';
  }
  let timeline = document.getElementById('toolTimeline');
  if (!timeline) {
    toolsContent.innerHTML = '<div class="tool-timeline" id="toolTimeline"></div>';
    timeline = document.getElementById('toolTimeline');
  }

  toolStepCounter++;
  const el = document.createElement('div');
  el.id = 'tl-' + tc.id;
  el.className = 'timeline-item active';
  const paramStr = JSON.stringify(tc.input || {}).substring(0, 120);
  el.innerHTML = `
    <div class="tl-time">Step ${toolStepCounter} · ${new Date().toLocaleTimeString().substring(0, 8)}</div>
    <div class="tl-tool">🔧 ${escapeHtml(tc.name)}</div>
    <div class="tl-detail" id="tl-${tc.id}-detail">参数: ${escapeHtml(paramStr)}</div>`;
  timeline.appendChild(el);
  toolsContent.scrollTop = toolsContent.scrollHeight;
}

function updateTimelineResult(tc) {
  const detail = document.getElementById('tl-' + tc.id + '-detail');
  if (detail) {
    let output = tc.output;
    if (typeof output !== 'string') output = JSON.stringify(output);
    // Try to clean nested JSON
    try {
      const parsed = JSON.parse(output);
      if (Array.isArray(parsed)) {
        output = parsed.map(i => typeof i === 'object' ? (i.text || i.content || JSON.stringify(i)) : String(i)).join('\n');
      }
    } catch(e) {}
    detail.textContent = '结果: ' + output;
  }
  const item = document.getElementById('tl-' + tc.id);
  if (item) item.classList.remove('active');
  toolsContent.scrollTop = toolsContent.scrollHeight;
}

// ====== Helpers ======
function scrollChat() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function setStatus(type, text) {
  statusBadge.className = 'badge ' + type;
  statusBadge.textContent = text;
}

function resetChat() {
  location.reload();
}

// ====== 停止 / 打断 ======
const stopBtn = document.getElementById('stopBtn');
const liveStatusEl = document.getElementById('liveStatus');

function showStopButton(show) {
  stopBtn.style.display = show ? 'inline-block' : 'none';
}

// 实时状态指示（现在在哪、在干啥）
function showLiveStatus(show, text, cls) {
  if (show) {
    liveStatusEl.style.display = 'inline-flex';
    if (text) liveStatusEl.textContent = text;
    if (cls) liveStatusEl.className = 'badge ' + cls;
  } else {
    liveStatusEl.style.display = 'none';
  }
}

function handleLiveStatus(st) {
  const phase = st.phase || '';
  const detail = st.detail || '';
  // 更新工具栏实时状态条
  if (phase === 'thinking') {
    showLiveStatus(true, '🧠 思考中…', 'live');
  } else if (phase === 'reasoning') {
    const preview = (st.preview || detail || '').slice(-60);
    showLiveStatus(true, '🧠 ' + preview, 'reasoning');
  } else if (phase === 'acting') {
    showLiveStatus(true, '🔧 ' + detail, 'acting');
  } else if (phase === 'pending') {
    showLiveStatus(true, '🔒 待确认', 'pending');
  } else if (phase === 'confirm') {
    showLiveStatus(true, '🔒 待确认', 'pending');
  } else if (phase === 'heartbeat') {
    // 心跳：agent 还在工作，别让用户以为它死了
    showLiveStatus(true, '⏳ ' + detail, 'live');
  } else if (phase === 'max_iters') {
    showLiveStatus(true, '⚠️ ' + detail, 'pending');
  } else if (phase === 'error') {
    showLiveStatus(true, '❌ ' + detail, 'pending');
  } else if (phase === 'paused') {
    showLiveStatus(true, '🔒 ' + detail, 'pending');
  } else if (phase === 'done') {
    showLiveStatus(false);
  }
}

async function stopGeneration() {
  if (!currentRequestId) return;
  _stopped = true;
  if (abortController) abortController.abort();
  showStopButton(false);
  setStatus('stopped', '已停止');
  // 2) 通知后端真正打断 agent 生成
  try {
    const resp = await fetch(`/stop?session_id=${encodeURIComponent(SESSION_ID)}&request_id=${encodeURIComponent(currentRequestId)}`, { method: 'GET' });
    const r = await resp.json();
    console.log('[stop]', r);
  } catch (e) {
    console.warn('[stop] request failed', e);
  }
}

function escapeHtml(s) {
  if (!s) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  if (!text) return '';
  let s = escapeHtml(text);
  // Code blocks
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Headers
  s = s.replace(/^### (.+)$/gm, '<h4 style="margin:8px 0 4px">$1</h4>');
  s = s.replace(/^## (.+)$/gm, '<h3 style="margin:10px 0 4px">$1</h3>');
  // Lists
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  // Line breaks
  s = s.replace(/\n/g, '<br>');
  return s;
}
