# PrismHarness — 示例配置（复制为 config.yaml 后填入你的 API Key）
#
# config.yaml 已在 .gitignore 中，不会被提交

llm:
  provider: "dsv4-local"
  temperature: 0.0
  enable_thinking: false
  # 模型上下文窗口（tokens）。这才是真正的容量上限——框架在
  # context_size × context.compress_threshold 处自动压缩历史。按实际模型填。
  context_size: 128000

providers:
  dsv4-local:
    api_key: "YOUR_API_KEY_HERE"
    api_base: "http://your-server:8900/v1"
    model: "dsv4"
    enable_thinking: false

agent:
  max_iters: 30
  parallel_tool_calls: false
  console_output: false
  # 团队/圆桌编排调优
  roundtable_timeout: 3600   # 整轮圆桌(19位并行+风控+决策)总预算(秒)；完整版需给足
  team_max_concurrent: 4     # 并行成员上限（共用远端端点时调小可降打断率）
  team_retries: 3            # 成员被打断时的重建重试次数

context:
  # 仅"预算"展示的兜底值；模型暴露 context_size 时以 llm.context_size 为准
  token_budget: 420000
  # 压缩触发比：token 数超过 context_size × 该值 时，框架自动把旧历史压成摘要
  compress_threshold: 0.8
  keep_recent_messages: 6

workspace:
  dir: "workspace"
  skills_dir: "skills"

logging:
  dir: "session_logs"

server:
  host: "127.0.0.1"
  port: 8765

session:
  expires: 300
